name: 🛠️ Build, Test & 🚀 Deploy to Swarm

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  # ── API checks: lint, cs-check, phpstan, tests ──
  api-checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: 🐘 Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          extensions: intl, mbstring, curl, json, openssl, simplexml
          tools: composer:v2

      - name: 📦 Install dependencies
        working-directory: api
        run: composer install --prefer-dist --no-progress --no-interaction

      - name: 🔍 Lint (phplint)
        working-directory: api
        run: composer lint

      - name: 🎨 CS Check (php-cs-fixer)
        working-directory: api
        run: composer cs-check

      - name: 🔬 Static analysis (phpstan)
        working-directory: api
        run: composer phpstan

      - name: 🧪 Tests (phpunit)
        working-directory: api
        run: composer test

  # ── Frontend checks: typecheck, lint ──
  frontend-checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: 📦 Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: frontend/package.json

      - name: 📦 Install dependencies
        working-directory: frontend
        run: npm ci

      - name: 🔍 Typecheck (vue-tsc)
        working-directory: frontend
        run: npx vue-tsc --noEmit

      - name: 🎨 Lint (eslint)
        working-directory: frontend
        run: npx eslint src --ext .vue,.js,.jsx,.cjs,.mjs,.ts,.tsx,.cts,.mts --ignore-pattern .gitignore

  # ── Build & push Docker images ──
  build-and-push:
    runs-on: ubuntu-latest
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: [ api-checks, frontend-checks ]
    steps:
      - uses: actions/checkout@v4

      - name: 🔧 Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: 🔑 Log in to Docker registry
        uses: docker/login-action@v3
        with:
          registry: ${{ secrets.REGISTRY_HOST }}
          username: ${{ secrets.REGISTRY_USER }}
          password: ${{ secrets.TOKEN_GIT_HUB }}

      - name: 🏗️ Build images
        env:
          REGISTRY: ${{ secrets.REGISTRY }}
          IMAGE_TAG: ${{ github.sha }}
          BUILD_NUMBER: ${{ github.run_number }}
        run: |
          IMAGE_TAG="${IMAGE_TAG::8}"
          export IMAGE_TAG
          make build

      - name: 📤 Push images
        env:
          REGISTRY: ${{ secrets.REGISTRY }}
          IMAGE_TAG: ${{ github.sha }}
          BUILD_NUMBER: ${{ github.run_number }}
        run: |
          IMAGE_TAG="${IMAGE_TAG::8}"
          export IMAGE_TAG
          make push

  # ── Deploy to Swarm ──
  deploy:
    runs-on: ubuntu-latest
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: build-and-push
    environment: production

    steps:
      - uses: actions/checkout@v4

      - name: 🔑 Setup SSH key
        env:
          SSH_PORT: ${{ secrets.PORT || '22' }}
          SSH_HOST: ${{ secrets.HOST }}
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.SSH_PRIVATE_KEY }}" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          ssh-keyscan -p "${SSH_PORT}" "${SSH_HOST}" >> ~/.ssh/known_hosts

      - name: 🚀 Deploy via make
        env:
          REGISTRY: ${{ secrets.REGISTRY }}
          IMAGE_TAG: ${{ github.sha }}
          BUILD_NUMBER: ${{ github.run_number }}
          HOST: ${{ secrets.HOST }}
          PORT: ${{ secrets.PORT || '22' }}
          DEPLOY_USER: ${{ secrets.DEPLOY_USER || 'deploy' }}
          REGISTRY_HOST: ${{ secrets.REGISTRY_HOST }}
          REGISTRY_USER: ${{ secrets.REGISTRY_USER }}
          TOKEN_GIT_HUB: ${{ secrets.TOKEN_GIT_HUB }}
          MYSQL_PASSWORD: ${{ secrets.MYSQL_PASSWORD }}
          MYSQL_ROOT_PASSWORD: ${{ secrets.MYSQL_ROOT_PASSWORD }}
          APP_DEBUG: ${{ secrets.APP_DEBUG }}
          APP_ENV: ${{ secrets.APP_ENV }}
        run: |
          IMAGE_TAG="${IMAGE_TAG::8}"
          export IMAGE_TAG
          make deploy
