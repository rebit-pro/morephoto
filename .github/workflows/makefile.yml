name: 🛠️ Build, Test & 🚀 Deploy to Swarm

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  # Задача для локальных проверок (оставлена как есть)
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Build dev images (for checks)
        run: docker compose build --pull

      - name: Install PHP dependencies
        run: docker compose run --rm api-php-cli composer install --no-interaction --no-progress

      - name: Run check
        run: make check
      # Добавьте другие тесты, если нужно, например: make test

  # НОВАЯ ЗАДАЧА: Сборка и публикация Docker-образов
  build-and-push:
    runs-on: ubuntu-latest
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: build
    steps:
      - uses: actions/checkout@v4
      - name: 🔧 Set up Docker Buildx
        uses: docker/setup-buildx-action@v3
      - name: 🔑 Log in to Docker registry
        uses: docker/login-action@v3
        with:
          registry: ${{ secrets.REGISTRY_HOST }}
          username: ${{ secrets.REGISTRY_USER }}
          password: ${{ secrets.TOKEN_GIT_HUB }}

      - name: 🏗️ Build images
        run: |
          # Ключевой момент: задаем тег и номер сборки
          export REGISTRY=${{ secrets.REGISTRY }}
          export IMAGE_TAG=${GITHUB_SHA::8}  # Используем короткий хеш коммита
          export BUILD_NUMBER=${GITHUB_RUN_NUMBER} # Используем номер запуска workflow
          make build

      - name: 📤 Push images
        run: |
          export REGISTRY=${{ secrets.REGISTRY }}
          export IMAGE_TAG=${GITHUB_SHA::8}
          export BUILD_NUMBER=${GITHUB_RUN_NUMBER}
          make push

  deploy:
    runs-on: ubuntu-latest
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: build-and-push
    environment: production
    steps:
      - uses: actions/checkout@v4
      - name: 🚀 Deploy to Swarm
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.HOST }}
          username: ${{ secrets.DEPLOY_USER || 'deploy' }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          port: ${{ secrets.PORT || 22 }}
          script: |
            cd /home/deploy/site
            # Передаем в make те же динамические значения
            export REGISTRY="${{ secrets.REGISTRY }}"
            export IMAGE_TAG="${{ github.sha }}"  # Полный хеш тоже подойдет
            export BUILD_NUMBER="${{ github.run_number }}"
            export HOST="${{ secrets.HOST }}"
            export REGISTRY_HOST="${{ secrets.REGISTRY_HOST }}"
            export REGISTRY_USER="${{ secrets.REGISTRY_USER }}"
            export TOKEN_GIT_HUB="${{ secrets.TOKEN_GIT_HUB }}"
            make deploy
