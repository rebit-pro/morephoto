name: 🛠️ Build, Test & 🚀 Deploy to Swarm

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    steps:
      - uses: actions/checkout@v4

      - name: 🔧 Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: 🔑 Log in to Docker registry
        uses: docker/login-action@v3
        with:
          registry: ${{ secrets.REGISTRY_HOST }}
          username: ${{ secrets.REGISTRY_USER }}
          password: ${{ secrets.TOKEN_GIT_HUB }}

      - name: 🏗️ Build images
        env:
          REGISTRY: ${{ secrets.REGISTRY }}
        run: |
          IMAGE_TAG="${GITHUB_SHA::8}"
          BUILD_NUMBER="${GITHUB_RUN_NUMBER}"
          export REGISTRY IMAGE_TAG BUILD_NUMBER
          make build

      - name: 📤 Push images
        env:
          REGISTRY: ${{ secrets.REGISTRY }}
        run: |
          IMAGE_TAG="${GITHUB_SHA::8}"
          BUILD_NUMBER="${GITHUB_RUN_NUMBER}"
          export REGISTRY IMAGE_TAG BUILD_NUMBER
          make push

  deploy:
    runs-on: ubuntu-latest
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: build-and-push
    environment: production

    steps:
      - uses: actions/checkout@v4

      - name: 🔢 Get short SHA
        id: vars
        run: echo "short_sha=${GITHUB_SHA::8}" >> "$GITHUB_OUTPUT"

      - name: 🔑 Setup SSH key
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.SSH_PRIVATE_KEY }}" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          ssh-keyscan -p "${{ secrets.PORT }}" "${{ secrets.HOST }}" >> ~/.ssh/known_hosts
        env:
          SSH_PRIVATE_KEY: ${{ secrets.SSH_PRIVATE_KEY }}

      - name: 🚀 Deploy via make
        env:
          REGISTRY: ${{ secrets.REGISTRY }}
          IMAGE_TAG: ${{ steps.vars.outputs.short_sha }}
          BUILD_NUMBER: ${{ github.run_number }}
          HOST: ${{ secrets.HOST }}
          PORT: ${{ secrets.PORT }}
          REGISTRY_HOST: ${{ secrets.REGISTRY_HOST }}
          REGISTRY_USER: ${{ secrets.REGISTRY_USER }}
          TOKEN_GIT_HUB: ${{ secrets.TOKEN_GIT_HUB }}
        run: |
          make deploy