services:
    frontend:
        build:
            context: frontend/docker
            dockerfile: development/nginx/Dockerfile
        networks:
            - traefik-public
            - default
        labels:
            - traefik.enable=true
            - traefik.docker.network=traefik-public
            - traefik.http.routers.frontend.rule=Host(`rebit-p2p.loc`) || Host(`www.rebit-p2p.loc`)
            - traefik.http.routers.frontend.entryPoints=https
            - traefik.http.routers.frontend.tls=true
            - traefik.http.services.frontend.loadBalancer.server.port=80
            - traefik.http.middlewares.frontend-redirect.redirectRegex.permanent=true
            - traefik.http.middlewares.frontend-redirect.redirectRegex.regex=^(https?://)www\.rebit-p2p\.loc/(.*)$$
            - traefik.http.middlewares.frontend-redirect.redirectRegex.replacement=$${1}rebit-p2p.loc/$${2}
            - traefik.http.routers.frontend.middlewares=frontend-redirect

    frontend-node:
        build:
            context: frontend/docker
            dockerfile: development/node/Dockerfile
        environment:
            NODE_ENV: development
            VITE_API_URL: /api
            HOST: 0.0.0.0 # Важно для Vite!
        command: sh -c "npm run dev" # Явное указание хоста
        volumes:
            - ./frontend:/app
        ports:
            - "5173:5173"  # Проброс порта Vite
        tty: true

    frontend-node-cli:
        build:
            context: frontend/docker
            dockerfile: development/node/Dockerfile
        volumes:
            - ./frontend:/app

    api:
        build:
            context: api/docker
            dockerfile: development/nginx/Dockerfile
        volumes:
            - ./api:/app
        networks:
            - traefik-public
            - default
        labels:
            - traefik.enable=true
            - traefik.docker.network=traefik-public
            - traefik.http.routers.api.rule=Host(`api.rebit-p2p.loc`) || Host(`www.api.rebit-p2p.loc`)
            - traefik.http.routers.api.entryPoints=https
            - traefik.http.routers.api.tls=true
            - traefik.http.services.api.loadBalancer.server.port=80
            - traefik.http.middlewares.api-redirect.redirectRegex.permanent=true
            - traefik.http.middlewares.api-redirect.redirectRegex.regex=^(https?://)www\.api\.rebit-p2p\.loc/(.*)$$
            - traefik.http.middlewares.api-redirect.redirectRegex.replacement=$${1}api.rebit-p2p.loc/$${2}
            - traefik.http.routers.api.middlewares=api-redirect

    api-php-fpm:
        build:
            context: api/docker
            dockerfile: development/php-fpm/Dockerfile
        extra_hosts:
            - "host.docker.internal:host-gateway"
            - "api.rebit-p2p.loc:host-gateway"
            - "rebit-p2p.loc:host-gateway"
        ports:  # Добавьте это!
            - "3307:3307"
            #- "9003:9003"  # Добавьте эту строку
        volumes:
            - ./api:/app
            - /home/user/traefik/certs/rebit-p2p.loc.pem:/usr/local/share/ca-certificates/rebit-p2p.loc.crt:ro
            - ./api/docker/common/php/docker-entrypoint.sh:/usr/local/bin/docker-entrypoint.sh
        environment:
            APP_DEBUG: ${APP_DEBUG:-1}
            APP_ENV: ${APP_ENV:-local}
            REDIS_HOST: ${REDIS_HOST:-redis}
            REDIS_PORT: ${REDIS_PORT:-6379}
            REBIT_ENCRYPTION_KEY: ${REBIT_ENCRYPTION_KEY}
            REBIT_AUTH_REGISTRATION_CODE_TTL_MINUTES: ${REBIT_AUTH_REGISTRATION_CODE_TTL_MINUTES:-15}
            REBIT_AUTH_REGISTRATION_RESEND_COOLDOWN_SECONDS: ${REBIT_AUTH_REGISTRATION_RESEND_COOLDOWN_SECONDS:-60}
            REBIT_AUTH_REGISTRATION_MAX_ATTEMPTS: ${REBIT_AUTH_REGISTRATION_MAX_ATTEMPTS:-5}
            REBIT_AUTH_MAIL_EVENT_SITE_ID: ${REBIT_AUTH_MAIL_EVENT_SITE_ID:-s1}
            REBIT_SMTP_HOST: ${REBIT_SMTP_HOST:-mailpit}
            REBIT_SMTP_PORT: ${REBIT_SMTP_PORT:-1025}
            REBIT_SMTP_ENCRYPTION: ${REBIT_SMTP_ENCRYPTION:-none}
            REBIT_SMTP_USERNAME: ${REBIT_SMTP_USERNAME:-}
            REBIT_SMTP_PASSWORD: ${REBIT_SMTP_PASSWORD:-}
            REBIT_SMTP_FROM_EMAIL: ${REBIT_SMTP_FROM_EMAIL:-noreply@rebit-p2p.loc}
            REBIT_SMTP_FROM_NAME: ${REBIT_SMTP_FROM_NAME:-Rebit P2P}
            REBIT_SMTP_TLS_CERTCHECK: ${REBIT_SMTP_TLS_CERTCHECK:-off}
            BYBIT_TESTNET_BASE_URL: ${BYBIT_TESTNET_BASE_URL:-https://api-testnet.bybit.com}
            BYBIT_MAINNET_BASE_URL: ${BYBIT_MAINNET_BASE_URL:-https://api.bybit.com}
            MESSENGER_TRANSPORT_DSN: amqp://${RABBITMQ_USER:-rebit}:${RABBITMQ_PASSWORD:-rebit}@rabbitmq:5672/${RABBITMQ_VHOST:-rebit}
            PHP_IDE_CONFIG: "serverName=API"

    api-php-cli:
        build:
            context: api/docker
            dockerfile: development/php-cli/Dockerfile
        extra_hosts:
            - "host.docker.internal:host-gateway"
            - "api.rebit-p2p.loc:host-gateway"
            - "rebit-p2p.loc:host-gateway"
        volumes:
            - ./api:/app
            - /home/user/traefik/certs/rebit-p2p.loc.pem:/usr/local/share/ca-certificates/rebit-p2p.loc.crt:ro
            - ./api/docker/common/php/docker-entrypoint.sh:/usr/local/bin/docker-entrypoint.sh
        environment:
            APP_DEBUG: ${APP_DEBUG:-1}
            APP_ENV: ${APP_ENV:-local}
            REDIS_HOST: ${REDIS_HOST:-redis}
            REDIS_PORT: ${REDIS_PORT:-6379}
            REBIT_ENCRYPTION_KEY: ${REBIT_ENCRYPTION_KEY}
            REBIT_AUTH_REGISTRATION_CODE_TTL_MINUTES: ${REBIT_AUTH_REGISTRATION_CODE_TTL_MINUTES:-15}
            REBIT_AUTH_REGISTRATION_RESEND_COOLDOWN_SECONDS: ${REBIT_AUTH_REGISTRATION_RESEND_COOLDOWN_SECONDS:-60}
            REBIT_AUTH_REGISTRATION_MAX_ATTEMPTS: ${REBIT_AUTH_REGISTRATION_MAX_ATTEMPTS:-5}
            REBIT_AUTH_MAIL_EVENT_SITE_ID: ${REBIT_AUTH_MAIL_EVENT_SITE_ID:-s1}
            REBIT_SMTP_HOST: ${REBIT_SMTP_HOST:-mailpit}
            REBIT_SMTP_PORT: ${REBIT_SMTP_PORT:-1025}
            REBIT_SMTP_ENCRYPTION: ${REBIT_SMTP_ENCRYPTION:-none}
            REBIT_SMTP_USERNAME: ${REBIT_SMTP_USERNAME:-}
            REBIT_SMTP_PASSWORD: ${REBIT_SMTP_PASSWORD:-}
            REBIT_SMTP_FROM_EMAIL: ${REBIT_SMTP_FROM_EMAIL:-noreply@rebit-p2p.loc}
            REBIT_SMTP_FROM_NAME: ${REBIT_SMTP_FROM_NAME:-Rebit P2P}
            REBIT_SMTP_TLS_CERTCHECK: ${REBIT_SMTP_TLS_CERTCHECK:-off}
            BYBIT_TESTNET_BASE_URL: ${BYBIT_TESTNET_BASE_URL:-https://api-testnet.bybit.com}
            BYBIT_MAINNET_BASE_URL: ${BYBIT_MAINNET_BASE_URL:-https://api.bybit.com}
            MESSENGER_TRANSPORT_DSN: amqp://${RABBITMQ_USER:-rebit}:${RABBITMQ_PASSWORD:-rebit}@rabbitmq:5672/${RABBITMQ_VHOST:-rebit}
            XDEBUG_MODE: off

    api-cron:
        build:
            context: api/docker
            dockerfile: development/php-cli/Dockerfile
        restart: unless-stopped
        command: ["sh", "-lc", "exec /usr/local/bin/supercronic /app/docker/common/cron/crontab"]
        extra_hosts:
            - "host.docker.internal:host-gateway"
            - "api.rebit-p2p.loc:host-gateway"
            - "rebit-p2p.loc:host-gateway"
        volumes:
            - ./api:/app
            - /home/user/traefik/certs/rebit-p2p.loc.pem:/usr/local/share/ca-certificates/rebit-p2p.loc.crt:ro
        environment:
            APP_DEBUG: ${APP_DEBUG:-1}
            APP_ENV: ${APP_ENV:-local}
            SHELL: /bin/sh
            REBIT_ENCRYPTION_KEY: ${REBIT_ENCRYPTION_KEY}
            REBIT_AUTH_REGISTRATION_CODE_TTL_MINUTES: ${REBIT_AUTH_REGISTRATION_CODE_TTL_MINUTES:-15}
            REBIT_AUTH_REGISTRATION_RESEND_COOLDOWN_SECONDS: ${REBIT_AUTH_REGISTRATION_RESEND_COOLDOWN_SECONDS:-60}
            REBIT_AUTH_REGISTRATION_MAX_ATTEMPTS: ${REBIT_AUTH_REGISTRATION_MAX_ATTEMPTS:-5}
            REBIT_AUTH_MAIL_EVENT_SITE_ID: ${REBIT_AUTH_MAIL_EVENT_SITE_ID:-s1}
            REBIT_SMTP_HOST: ${REBIT_SMTP_HOST:-mailpit}
            REBIT_SMTP_PORT: ${REBIT_SMTP_PORT:-1025}
            REBIT_SMTP_ENCRYPTION: ${REBIT_SMTP_ENCRYPTION:-none}
            REBIT_SMTP_USERNAME: ${REBIT_SMTP_USERNAME:-}
            REBIT_SMTP_PASSWORD: ${REBIT_SMTP_PASSWORD:-}
            REBIT_SMTP_FROM_EMAIL: ${REBIT_SMTP_FROM_EMAIL:-noreply@rebit-p2p.loc}
            REBIT_SMTP_FROM_NAME: ${REBIT_SMTP_FROM_NAME:-Rebit P2P}
            REBIT_SMTP_TLS_CERTCHECK: ${REBIT_SMTP_TLS_CERTCHECK:-off}
            BYBIT_TESTNET_BASE_URL: ${BYBIT_TESTNET_BASE_URL:-https://api-testnet.bybit.com}
            BYBIT_MAINNET_BASE_URL: ${BYBIT_MAINNET_BASE_URL:-https://api.bybit.com}
            MESSENGER_TRANSPORT_DSN: amqp://${RABBITMQ_USER:-rebit}:${RABBITMQ_PASSWORD:-rebit}@rabbitmq:5672/${RABBITMQ_VHOST:-rebit}

    api-notification-consumer:
        build:
            context: api/docker
            dockerfile: development/php-cli/Dockerfile
        restart: unless-stopped
        command: ["php", "public/local/bin/bitrix-console", "app:notification:consume"]
        extra_hosts:
            - "host.docker.internal:host-gateway"
            - "api.rebit-p2p.loc:host-gateway"
            - "rebit-p2p.loc:host-gateway"
        volumes:
            - ./api:/app
            - /home/user/traefik/certs/rebit-p2p.loc.pem:/usr/local/share/ca-certificates/rebit-p2p.loc.crt:ro
        environment:
            APP_DEBUG: ${APP_DEBUG:-1}
            APP_ENV: ${APP_ENV:-local}
            REBIT_ENCRYPTION_KEY: ${REBIT_ENCRYPTION_KEY}
            REBIT_AUTH_MAIL_EVENT_SITE_ID: ${REBIT_AUTH_MAIL_EVENT_SITE_ID:-s1}
            REBIT_SMTP_HOST: ${REBIT_SMTP_HOST:-mailpit}
            REBIT_SMTP_PORT: ${REBIT_SMTP_PORT:-1025}
            REBIT_SMTP_ENCRYPTION: ${REBIT_SMTP_ENCRYPTION:-none}
            REBIT_SMTP_USERNAME: ${REBIT_SMTP_USERNAME:-}
            REBIT_SMTP_PASSWORD: ${REBIT_SMTP_PASSWORD:-}
            REBIT_SMTP_FROM_EMAIL: ${REBIT_SMTP_FROM_EMAIL:-noreply@rebit-p2p.loc}
            REBIT_SMTP_FROM_NAME: ${REBIT_SMTP_FROM_NAME:-Rebit P2P}
            REBIT_SMTP_TLS_CERTCHECK: ${REBIT_SMTP_TLS_CERTCHECK:-off}
            MESSENGER_TRANSPORT_DSN: amqp://${RABBITMQ_USER:-rebit}:${RABBITMQ_PASSWORD:-rebit}@rabbitmq:5672/${RABBITMQ_VHOST:-rebit}
        depends_on:
            - rabbitmq

    api-trade-event-consumer:
        build:
            context: api/docker
            dockerfile: development/php-cli/Dockerfile
        restart: unless-stopped
        command: ["php", "public/local/bin/bitrix-console", "app:exchange:trade-event:consume"]
        extra_hosts:
            - "host.docker.internal:host-gateway"
            - "api.rebit-p2p.loc:host-gateway"
            - "rebit-p2p.loc:host-gateway"
        volumes:
            - ./api:/app
            - /home/user/traefik/certs/rebit-p2p.loc.pem:/usr/local/share/ca-certificates/rebit-p2p.loc.crt:ro
        environment:
            APP_DEBUG: ${APP_DEBUG:-1}
            APP_ENV: ${APP_ENV:-local}
            REBIT_ENCRYPTION_KEY: ${REBIT_ENCRYPTION_KEY}
            MESSENGER_TRANSPORT_DSN: amqp://${RABBITMQ_USER:-rebit}:${RABBITMQ_PASSWORD:-rebit}@rabbitmq:5672/${RABBITMQ_VHOST:-rebit}
        depends_on:
            - rabbitmq

    api-chat-script-consumer:
        build:
            context: api/docker
            dockerfile: development/php-cli/Dockerfile
        restart: unless-stopped
        command: ["php", "public/local/bin/bitrix-console", "app:exchange:chat-script:consume"]
        extra_hosts:
            - "host.docker.internal:host-gateway"
            - "api.rebit-p2p.loc:host-gateway"
            - "rebit-p2p.loc:host-gateway"
        volumes:
            - ./api:/app
            - /home/user/traefik/certs/rebit-p2p.loc.pem:/usr/local/share/ca-certificates/rebit-p2p.loc.crt:ro
        environment:
            APP_DEBUG: ${APP_DEBUG:-1}
            APP_ENV: ${APP_ENV:-local}
            REBIT_ENCRYPTION_KEY: ${REBIT_ENCRYPTION_KEY}
            MESSENGER_TRANSPORT_DSN: amqp://${RABBITMQ_USER:-rebit}:${RABBITMQ_PASSWORD:-rebit}@rabbitmq:5672/${RABBITMQ_VHOST:-rebit}
        depends_on:
            - rabbitmq

    api-balance-sync-consumer:
        build:
            context: api/docker
            dockerfile: development/php-cli/Dockerfile
        restart: unless-stopped
        command: ["php", "public/local/bin/bitrix-console", "app:wallet:balance-sync:consume"]
        extra_hosts:
            - "host.docker.internal:host-gateway"
            - "api.rebit-p2p.loc:host-gateway"
            - "rebit-p2p.loc:host-gateway"
        volumes:
            - ./api:/app
            - /home/user/traefik/certs/rebit-p2p.loc.pem:/usr/local/share/ca-certificates/rebit-p2p.loc.crt:ro
        environment:
            APP_DEBUG: ${APP_DEBUG:-1}
            APP_ENV: ${APP_ENV:-local}
            REBIT_ENCRYPTION_KEY: ${REBIT_ENCRYPTION_KEY}
            MESSENGER_TRANSPORT_DSN: amqp://${RABBITMQ_USER:-rebit}:${RABBITMQ_PASSWORD:-rebit}@rabbitmq:5672/${RABBITMQ_VHOST:-rebit}
        depends_on:
            - rabbitmq

    api-identity-sync-consumer:
        build:
            context: api/docker
            dockerfile: development/php-cli/Dockerfile
        restart: unless-stopped
        command: ["php", "public/local/bin/bitrix-console", "app:identity:sync:consume"]
        extra_hosts:
            - "host.docker.internal:host-gateway"
            - "api.rebit-p2p.loc:host-gateway"
            - "rebit-p2p.loc:host-gateway"
        volumes:
            - ./api:/app
            - /home/user/traefik/certs/rebit-p2p.loc.pem:/usr/local/share/ca-certificates/rebit-p2p.loc.crt:ro
        environment:
            APP_DEBUG: ${APP_DEBUG:-1}
            APP_ENV: ${APP_ENV:-local}
            REBIT_ENCRYPTION_KEY: ${REBIT_ENCRYPTION_KEY}
            MESSENGER_TRANSPORT_DSN: amqp://${RABBITMQ_USER:-rebit}:${RABBITMQ_PASSWORD:-rebit}@rabbitmq:5672/${RABBITMQ_VHOST:-rebit}
        depends_on:
            - rabbitmq

    api-audit-consumer:
        build:
            context: api/docker
            dockerfile: development/php-cli/Dockerfile
        restart: unless-stopped
        command: ["php", "public/local/bin/bitrix-console", "app:audit:consume"]
        extra_hosts:
            - "host.docker.internal:host-gateway"
            - "api.rebit-p2p.loc:host-gateway"
            - "rebit-p2p.loc:host-gateway"
        volumes:
            - ./api:/app
            - /home/user/traefik/certs/rebit-p2p.loc.pem:/usr/local/share/ca-certificates/rebit-p2p.loc.crt:ro
        environment:
            APP_DEBUG: ${APP_DEBUG:-1}
            APP_ENV: ${APP_ENV:-local}
            REBIT_ENCRYPTION_KEY: ${REBIT_ENCRYPTION_KEY}
            MESSENGER_TRANSPORT_DSN: amqp://${RABBITMQ_USER:-rebit}:${RABBITMQ_PASSWORD:-rebit}@rabbitmq:5672/${RABBITMQ_VHOST:-rebit}
        depends_on:
            - rabbitmq

    api-mysql:
        build:
            context: api/docker
            dockerfile: development/mysql/Dockerfile
        restart: always
        environment:
            MYSQL_DATABASE: ${MYSQL_DATABASE:-app}
            MYSQL_USER: ${MYSQL_USER:-app}
            MYSQL_PASSWORD: ${MYSQL_PASSWORD}
            MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD}
        volumes:
            - api-mysql:/var/lib/mysql
        ports:
            - "33069:3306"

    api-memcached:
        image: memcached:latest
        restart: always
        command: memcached -m 64m -vv
        ports:
            - "11212:11211"
        networks:
            - default

    mailpit:
        image: axllent/mailpit:v1.27
        restart: unless-stopped
        ports:
            - "1025:1025"
            - "8025:8025"

    rabbitmq:
        image: rabbitmq:3.13-management-alpine
        restart: unless-stopped
        ports:
            - "5672:5672"
            - "15672:15672"
        environment:
            RABBITMQ_DEFAULT_USER: ${RABBITMQ_USER:-rebit}
            RABBITMQ_DEFAULT_PASS: ${RABBITMQ_PASSWORD:-rebit}
            RABBITMQ_DEFAULT_VHOST: ${RABBITMQ_VHOST:-rebit}
        volumes:
            - rabbitmq-data:/var/lib/rabbitmq

volumes:
    api-mysql:
    rabbitmq-data:

networks:
    traefik-public:
        external: true
        driver: bridge
