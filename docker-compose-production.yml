services:
    frontend:
        image: ${REGISTRY}/morephoto-frontend:${IMAGE_TAG}
        environment:
            VITE_APP_AUTH_URL: https://api.rebit-pro.ru
        networks:
            - traefik-public
            - default
        deploy:
            labels:
                - traefik.enable=true
                - traefik.docker.network=traefik-public
                - traefik.http.routers.frontend.rule=Host(`photo.rebit-pro.ru`) || Host(`www.photo.rebit-pro.ru`)
                - traefik.http.services.frontend.loadBalancer.server.port=80
                - traefik.http.middlewares.frontend-redirect.redirectRegex.regex=^(https?://)www.photo.rebit-pro.ru/(.*)$$
                - traefik.http.middlewares.frontend-redirect.redirectRegex.replacement=$${1}photo.rebit-pro.ru/$${2}
                - traefik.http.middlewares.frontend-redirect.redirectRegex.permanent=true
                - traefik.http.routers.frontend.middlewares=frontend-redirect,secure-headers
                - traefik.http.routers.frontend.entryPoints=https
                - traefik.http.routers.frontend.tls=true
                - traefik.http.routers.frontend.tls.certResolver=letsEncrypt
            mode: replicated
            replicas: 2
            update_config:
                parallelism: 1
                delay: 10s

    api:
        image: ${REGISTRY}/morephoto-api:${IMAGE_TAG}
        networks:
          - traefik-public
          - default
        volumes:
          - type: bind
            source: /srv/morephoto/bitrix
            target: /app/public/bitrix
          - type: bind
            source: /srv/morephoto/upload
            target: /app/public/upload
        deploy:
          labels:
            - traefik.enable=true
            - traefik.docker.network=traefik-public
            - traefik.http.routers.api.rule=Host(`api.rebit-pro.ru`)
            - traefik.http.services.api.loadBalancer.server.port=80
            - traefik.http.routers.api.middlewares=secure-headers
            - traefik.http.routers.api.entryPoints=https
            - traefik.http.routers.api.tls=true
            - traefik.http.routers.api.tls.certResolver=letsEncrypt
          mode: replicated
          replicas: 1
          update_config:
            parallelism: 1
            delay: 5s

    api-php-fpm:
        image: ${REGISTRY}/morephoto-api-php-fpm:${IMAGE_TAG}
        restart: always
        environment:
          APP_DEBUG: 0
          APP_ENV: "production"
        volumes:
          - type: bind
            source: /srv/morephoto/bitrix
            target: /app/public/bitrix
          - type: bind
            source: /srv/morephoto/upload
            target: /app/public/upload
        deploy:
          mode: replicated
          replicas: 1
          update_config:
            parallelism: 1
            delay: 5s

    api-mysql:
        image: percona:8.0
        environment:
            MYSQL_DATABASE: app
            MYSQL_USER: app
            MYSQL_PASSWORD: secrets
            MYSQL_ROOT_PASSWORD: rootpassword
        volumes:
            - api-mysql:/var/lib/mysql
        deploy:
            placement:
                constraints: [ node.labels.db == db ]
            endpoint_mode: dnsrr

volumes:
    api-mysql:

networks:
    traefik-public:
        external: true